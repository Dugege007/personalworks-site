<!doctype html>
<html lang="zh-CN" data-skin="strata">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var KEY = "strata.prefs";
        // 须与 src/content/prefs.ts 中 isDefault 那条的 id 一致
        var FALLBACK = "strata";
        try {
          var parsed = JSON.parse(localStorage.getItem(KEY) || "null");
          var skin = parsed && typeof parsed.skin === "string" ? parsed.skin : FALLBACK;
          document.documentElement.setAttribute("data-skin", skin);
        } catch (err) {
          document.documentElement.setAttribute("data-skin", FALLBACK);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="层境 STRATA — 杜宏博的个人作品场：数字孪生、产线仿真、景观、摄影与游戏。"
    />
    <title>层境 STRATA · 杜宏博</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;900&family=Noto+Serif+SC:wght@500;600;700&family=Outfit:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
